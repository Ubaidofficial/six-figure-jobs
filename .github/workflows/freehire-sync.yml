name: freehire daily sync

# Pulls the last ~36 hours of fresh six-figure jobs from freehire (US, UK, EU, Canada, Australia) through
# the normal ingest path, then expires jobs not refreshed in 7 days. Runs daily; can also be started by hand.
# New/removed URLs are queued in the database (JobIndexingQueue) during the sync, never sent in a burst; after the
# sync, the queue is drained at most INDEXING_API_DAILY_LIMIT URLs a day (only that step gets the Google credentials).
# It also refreshes the listing slices and runs the data-quality self-heal: the three steps that used to run in the
# "Scheduled Job Scraper" workflow, which is no longer needed for jobs now that freehire is the source.
# Note: GitHub disables scheduled workflows after 60 days with no repository activity.

on:
  schedule:
    - cron: "17 5 * * *" # 05:17 UTC daily
  workflow_dispatch:
    inputs:
      closed_apply:
        description: "Expire jobs freehire reports as closed. Scheduled (daily) runs always do; a manual run only does if ticked."
        type: boolean
        default: false
      lookback_days:
        description: "How many days of freehire jobs to re-read (default 1.5). Use 8 to backfill skills/visa on existing jobs."
        type: string
        default: "1.5"

# Shares a group with the manual reload so the two never write to the database at the same time.
concurrency:
  group: freehire-reload
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      FREEHIRE_API_KEY: ${{ secrets.FREEHIRE_API_KEY }}
      FREEHIRE_LOOKBACK_DAYS: ${{ inputs.lookback_days || '1.5' }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Database target guard
        env:
          EXPECTED_DB_TARGET_FINGERPRINT: ${{ vars.PRODUCTION_DB_TARGET_FINGERPRINT }}
        run: npm run scrape:db-target

      - name: Sync freehire jobs
        id: sync
        run: npm run sync:freehire

      # Asks freehire about each active job individually and expires those it reports as closed AND that its open
      # search no longer lists (lib/scrapers/freehireClosedCheck.ts). LIVE on the daily schedule; a manual run is
      # report-only unless closed_apply is ticked. The check skips itself with a warning if more than 5% of lookups
      # fail, and aborts (failing the run, so the owner is emailed) if it would expire more than 40% of what it
      # checked. To switch it off, change the schedule condition below to report-only.
      # Both closed-check steps stop themselves after 15 minutes (nothing is expired) and the step timeout is a second
      # guard, so a stall here can no longer eat the whole job (on 2026-11-05 the scheduled run sat 42 minutes in this
      # step with no output, hit the job timeout and never reached the 7-day expiry below).
      - name: Closed-job check (report only)
        if: ${{ success() && github.event_name != 'schedule' && !inputs.closed_apply }}
        timeout-minutes: 20
        run: npm run check-closed:freehire -- --dry-run

      - name: Expire jobs freehire has closed
        if: ${{ success() && (github.event_name == 'schedule' || inputs.closed_apply) }}
        timeout-minutes: 20
        run: npm run check-closed:freehire

      # Employers read straight from their own applicant tracking system (lib/constants/directEmployers.ts: OpenAI,
      # Anthropic, SpaceX, xAI and ~90 more), through the normal ATS ingest. Independent of freehire: it runs even when
      # the freehire sync failed (for example on freehire's daily quota), and the steps below run if either succeeded.
      - name: Sync direct employers
        id: employers
        if: ${{ !cancelled() }}
        timeout-minutes: 90
        run: npx tsx scripts/sync-direct-employers.ts
      # 4dayweek.io's four-day-week listings (reduced hours at full pay) from its public API, for /jobs/4-day-week.
      # Independent of the steps above; a failure here does not stop the steps below. Seen jobs are refreshed daily, so
      # a listing 4dayweek.io drops expires with the 7-day rule below.
      - name: Sync 4-day-week jobs
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 10
        run: npm run sync:fourdayweek
      # Worldwide-remote jobs from We Work Remotely (RSS) and Himalayas (search API), which freehire barely carries.
      # Independent of the steps above; a failure here does not stop the steps below.
      - name: Sync worldwide remote boards
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 10
        run: npm run sync:worldwide-boards
      # Runs whenever a sync succeeded, even if the closed-job check above failed or timed out.
      - name: Expire jobs not refreshed in 7 days
        if: ${{ !cancelled() && (steps.sync.conclusion == 'success' || steps.employers.conclusion == 'success') }}
        run: npx tsx scripts/run-expiry.ts
      # The steps below each run whenever the sync succeeded, even if an earlier step after it failed.
      # Self-heal data quality, including filling missing roles and countries; before the slices so they include them.
      - name: Data quality remediation (self-heal)
        if: ${{ !cancelled() && (steps.sync.conclusion == 'success' || steps.employers.conclusion == 'success') }}
        timeout-minutes: 10
        run: npm run remediate:data-quality
      # Rebuild the precomputed role / country / salary listing slices from today's jobs.
      - name: Refresh slices
        if: ${{ !cancelled() && (steps.sync.conclusion == 'success' || steps.employers.conclusion == 'success') }}
        timeout-minutes: 10
        run: |
          set -euo pipefail
          npx tsx scripts/bootstrapRoleSlices.ts
          npx tsx scripts/seedJobSlices.ts
          npx tsx scripts/bootstrapCountrySalarySlices.ts
      # Send queued new/updated/removed job URLs to the Google Indexing API, at most 180 a day (Google's default
      # quota is 200). Expired jobs in the queue are skipped by the worker.
      - name: Drain Google Indexing queue
        if: ${{ !cancelled() && (steps.sync.conclusion == 'success' || steps.employers.conclusion == 'success') }}
        timeout-minutes: 10
        env:
          GOOGLE_INDEXING_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_INDEXING_SERVICE_ACCOUNT_JSON }}
          INDEXING_API_DRY_RUN: "0"
          INDEXING_API_DAILY_LIMIT: "180"
        run: npx tsx scripts/process-google-indexing-queue.ts
