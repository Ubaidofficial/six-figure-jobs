name: Data Quality Guard

on:
  schedule:
    # Daily at 07:00 UTC (after the Mon/Thu scrape window, independent of it).
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  data-quality:
    name: Live data invariants
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Remediate data quality (self-heal)
        run: npm run remediate:data-quality

      - name: Audit data quality
        run: npm run audit:data-quality
