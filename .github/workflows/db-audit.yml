name: database audit

# Manual only, read-only. Prints a report of what the live Job and Company tables hold (counts and the most common remote
# location texts) to the run's summary. Every statement is a SELECT and the run is one READ ONLY transaction
# (scripts/audit-db-coverage.ts), so it cannot change data. It uses the same production-database fingerprint guard as the
# migrate and freehire workflows.

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Days of postings the work-mode audit reads (default 3; up to 30)"
        type: string
        required: false
        default: "3"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Database target guard
        env:
          EXPECTED_DB_TARGET_FINGERPRINT: ${{ vars.PRODUCTION_DB_TARGET_FINGERPRINT }}
        run: npm run scrape:db-target

      - name: remote100k.com jobs we have and lack (read-only; reads remote100k's public job pages, 4 at a time)
        run: npx tsx scripts/auditRemote100kCoverage.ts

      - name: Coverage audit (read-only)
        run: npm run audit:db-coverage

      - name: Remote and place data of jobs posted in the last 3 days (read-only)
        run: npx tsx scripts/auditRecentRemote.ts --days=${{ inputs.days || '3' }}

      - name: Board jobs stored on-site whose own text says remote or hybrid (dry run, read-only)
        run: npx tsx scripts/repairBoardWorkMode.ts --days=${{ inputs.days || '30' }}

      - name: Skills on live jobs against the skill pages (read-only)
        run: npx tsx scripts/auditSkillCoverage.ts

      - name: Anywhere-in-the-world remote jobs and what the rule leaves out (read-only)
        run: npx tsx scripts/auditWorldwideRemote.ts
