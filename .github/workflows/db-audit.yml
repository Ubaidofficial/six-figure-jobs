name: database audit

# Manual only, read-only. Prints a report of what the live Job and Company tables hold (counts and the most common remote
# location texts) to the run's summary. Every statement is a SELECT and the run is one READ ONLY transaction
# (scripts/audit-db-coverage.ts), so it cannot change data. It uses the same production-database fingerprint guard as the
# migrate and freehire workflows.

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Database target guard
        env:
          EXPECTED_DB_TARGET_FINGERPRINT: ${{ vars.PRODUCTION_DB_TARGET_FINGERPRINT }}
        run: npm run scrape:db-target

      - name: Coverage audit (read-only)
        run: npm run audit:db-coverage
