name: clean job titles

# Manual only. Cleans the titles of live jobs already stored ("---" chains, the job's own city, pay typed into the
# title; lib/jobs/cleanTitle.ts). A dry run by default: it prints how many would change and examples. Tick "apply" to
# write. New freehire jobs are cleaned on import, so this is for the jobs stored before 2026-11-24.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Write the cleaned titles (leave off for a dry run)"
        type: boolean
        default: false

concurrency:
  group: freehire-reload # never while a sync is writing
  cancel-in-progress: false

jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Database target guard
        env:
          EXPECTED_DB_TARGET_FINGERPRINT: ${{ vars.PRODUCTION_DB_TARGET_FINGERPRINT }}
        run: npm run scrape:db-target
      - name: Clean titles
        run: npx tsx scripts/cleanJobTitles.ts ${{ inputs.apply && '--apply' || '' }}
