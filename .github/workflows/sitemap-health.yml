name: Sitemap Health Check

on:
  pull_request:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch:

concurrency:
  group: sitemap-health
  cancel-in-progress: false

jobs:
  health-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: six_figure_jobs_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d six_figure_jobs_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/six_figure_jobs_ci?schema=public
      SITE_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare database schema
        run: npx prisma db push

      - name: Seed sitemap fixture data
        run: |
          node --import tsx <<'NODE'
          import { prisma } from './lib/prisma'

          const now = new Date()
          const company = await prisma.company.upsert({
            where: { slug: 'seed-sitemap-company' },
            update: { name: 'Seed Sitemap Company' },
            create: {
              name: 'Seed Sitemap Company',
              slug: 'seed-sitemap-company',
            },
          })

          for (let i = 1; i <= 12; i += 1) {
            const id = `seed-health-job-${i}`
            await prisma.job.upsert({
              where: { id },
              update: {
                title: `Senior Software Engineer ${i}`,
                company: company.name,
                companyId: company.id,
                roleSlug: 'software-engineer',
                locationRaw: 'New York, NY, US',
                city: 'New York',
                citySlug: 'new-york',
                countryCode: 'US',
                remote: true,
                remoteMode: 'remote',
                descriptionHtml:
                  '<p>Build and ship distributed systems at scale with strong engineering standards and clear ownership.</p>',
                source: 'seed:health-check',
                url: `https://example.com/jobs/${id}`,
                applyUrl: `https://example.com/jobs/${id}/apply`,
                externalId: `seed-ext-${i}`,
                type: 'full-time',
                experienceLevel: 'senior',
                employmentType: 'full-time',
                postedAt: now,
                salaryRaw: '$180k-$220k',
                salaryMin: BigInt(180000),
                salaryMax: BigInt(220000),
                salaryCurrency: 'USD',
                salaryPeriod: 'yearly',
                minAnnual: BigInt(180000),
                maxAnnual: BigInt(220000),
                currency: 'USD',
                salaryValidated: true,
                salaryConfidence: 95,
                isHighSalary: true,
                isHundredKLocal: true,
                isHighSalaryLocal: true,
                isExpired: false,
              },
              create: {
                id,
                title: `Senior Software Engineer ${i}`,
                company: company.name,
                companyId: company.id,
                roleSlug: 'software-engineer',
                locationRaw: 'New York, NY, US',
                city: 'New York',
                citySlug: 'new-york',
                countryCode: 'US',
                remote: true,
                remoteMode: 'remote',
                descriptionHtml:
                  '<p>Build and ship distributed systems at scale with strong engineering standards and clear ownership.</p>',
                source: 'seed:health-check',
                url: `https://example.com/jobs/${id}`,
                applyUrl: `https://example.com/jobs/${id}/apply`,
                externalId: `seed-ext-${i}`,
                type: 'full-time',
                experienceLevel: 'senior',
                employmentType: 'full-time',
                postedAt: now,
                salaryRaw: '$180k-$220k',
                salaryMin: BigInt(180000),
                salaryMax: BigInt(220000),
                salaryCurrency: 'USD',
                salaryPeriod: 'yearly',
                minAnnual: BigInt(180000),
                maxAnnual: BigInt(220000),
                currency: 'USD',
                salaryValidated: true,
                salaryConfidence: 95,
                isHighSalary: true,
                isHundredKLocal: true,
                isHighSalaryLocal: true,
                isExpired: false,
              },
            })
          }

          await prisma.jobSlice.upsert({
            where: { slug: 'seed-priority-software-engineer' },
            update: {
              type: 'role-salary',
              filtersJson: JSON.stringify({
                roleSlugs: ['software-engineer'],
                minAnnual: 100000,
              }),
              jobCount: 12,
            },
            create: {
              slug: 'seed-priority-software-engineer',
              type: 'role-salary',
              filtersJson: JSON.stringify({
                roleSlugs: ['software-engineer'],
                minAnnual: 100000,
              }),
              jobCount: 12,
            },
          })

          await prisma.$disconnect()
          NODE

      - name: Build
        run: npm run build

      - name: Start app
        run: |
          SITE_URL=http://localhost:3000 npm run start >/tmp/sitemap-health-next.log 2>&1 &
          echo $! >/tmp/sitemap-health-next.pid

          for i in $(seq 1 90); do
            if curl -fsS http://localhost:3000/sitemap.xml >/dev/null; then
              exit 0
            fi
            sleep 2
          done

          echo "App failed to start in time."
          cat /tmp/sitemap-health-next.log || true
          exit 1

      - name: Run sitemap health check
        env:
          SITE_URL: "http://localhost:3000"
          CHILD_SITEMAP_SAMPLE: "3"
          JOB_URL_SAMPLE: "20"
          GENERAL_URL_SAMPLE: "5"
          MAX_BAD_URLS: "2"
        run: node scripts/sitemap-health-check.mjs

      - name: Stop app
        if: always()
        run: |
          if [ -f /tmp/sitemap-health-next.pid ]; then
            kill "$(cat /tmp/sitemap-health-next.pid)" || true
          fi

  health-prod:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run sitemap health check
        env:
          SITE_URL: "https://www.6figjobs.com"
          CHILD_SITEMAP_SAMPLE: "3"
          JOB_URL_SAMPLE: "20"
          GENERAL_URL_SAMPLE: "5"
          MAX_BAD_URLS: "2"
        run: node scripts/sitemap-health-check.mjs
