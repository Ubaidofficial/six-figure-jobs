name: Daily Job Scraper (Automated)

on:
  schedule:
    - cron: "0 6,18 * * *" # 6am and 6pm UTC daily
  workflow_dispatch:

concurrency:
  group: daily-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90 # Changed from 15 to 90 for full scrape

    if: github.event_name == 'schedule' || github.ref == 'refs/heads/develop'

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      AI_ENRICHMENT_PAUSED: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Run scrapers (boards + ATS)
        run: npx tsx scripts/dailyScrapeV2.ts --mode=all --concurrency=3

      - name: Enrich apply URLs
        run: npx tsx scripts/enrich-apply-urls.ts

      - name: Location parsing
        run: DRY_RUN=0 TAKE=10000 npx tsx scripts/repair-location-v2.10.ts

      - name: Update slices
        run: |
          npx tsx scripts/bootstrapRoleSlices.ts
          npx tsx scripts/seedJobSlices.ts
          npx tsx scripts/bootstrapCountrySalarySlices.ts
