name: Daily Job Scraper (Automated)

on:
  schedule:
    - cron: "0 6,18 * * *" # 6am and 6pm UTC daily
  workflow_dispatch:

concurrency:
  group: daily-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90 # Changed from 15 to 90 for full scrape

    if: github.event_name == 'schedule' || github.ref == 'refs/heads/develop'

    steps:
      - name: Trigger Railway Scraper API
        id: start
        shell: bash
        run: |
          set -euo pipefail

          echo "🚀 Triggering job scraper on Railway..."
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Ref:   $GITHUB_REF"

          RESPONSE=$(curl -sS -w "\n%{http_code}" -X POST \
            "https://www.6figjobs.com/api/cron/scrape?mode=all" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --retry 2 \
            --retry-delay 30)

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)

          echo "📊 Response Code: $HTTP_CODE"
          echo "📄 Response Body: $BODY"

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "❌ Scraper trigger failed with code $HTTP_CODE"
            exit 1
          fi

          # Parse success flags defensively (do not fail the step if BODY isn't valid JSON)
          SUCCESS="$(echo "$BODY" | jq -r '.success // .ok // false' 2>/dev/null || true)"
          JOB_ID="$(echo "$BODY" | jq -r '.jobId // .runId // empty' 2>/dev/null || true)"

          # If the API returns an explicit success=false, fail.
          # If there's no success flag, we still allow success if a jobId/runId exists.
          if [ "$SUCCESS" != "true" ] && [ -z "${JOB_ID:-}" ]; then
            echo "❌ Trigger response did not indicate success and no jobId was provided."
            exit 1
          fi

          echo "job_id=${JOB_ID:-}" >> "$GITHUB_OUTPUT"

          if [ -z "${JOB_ID:-}" ]; then
            echo "⚠️ Trigger succeeded but no jobId returned; continuing in fire-and-forget mode (skipping wait)."
            exit 0
          fi

          echo "✅ Scraper started. jobId=$JOB_ID"

      - name: Wait for scrape completion
        if: steps.start.outputs.job_id != ''
        shell: bash
        run: |
          set -euo pipefail

          JOB_ID="${{ steps.start.outputs.job_id }}"
          echo "⏳ Waiting for scrape job to finish: ${JOB_ID}"

          MAX_ATTEMPTS=80
          for i in $(seq 1 "$MAX_ATTEMPTS"); do
            RESPONSE=$(curl -sS -w "\n%{http_code}" \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
              "https://www.6figjobs.com/api/scrape/status/${JOB_ID}")

            HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
            BODY=$(echo "$RESPONSE" | head -n-1)

            echo "Poll ${i}/${MAX_ATTEMPTS} (HTTP ${HTTP_CODE})"

            if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
              echo "❌ Status check failed: ${BODY}"
              exit 1
            fi

            STATUS="$(echo "$BODY" | jq -r '.status // empty' 2>/dev/null || true)"
            if [ "$STATUS" = "completed" ]; then
              echo "✅ Scrape completed"
              exit 0
            fi

            if [ "$STATUS" = "failed" ]; then
              echo "❌ Scrape failed: $(echo "$BODY" | jq -r '.error // empty' 2>/dev/null || true)"
              exit 1
            fi

            sleep 60
          done

          echo "⏰ Timed out waiting for scrape completion"
          exit 1

      - name: Report Failure
        if: failure()
        run: |
          echo "⚠️ Scraper failed!"
          echo "🔍 Check Railway logs in your Railway project Deployments tab."
