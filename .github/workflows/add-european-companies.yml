name: add european companies

# Manual. Adds the European Greenhouse boards in lib/companies/europeanBoards.ts as Company rows (see
# scripts/addEuropeanCompanies.ts). A dry run unless "apply" is ticked: the dry run prints the plan and writes nothing.
# Uses the same production-database fingerprint guard as the migrate and freehire workflows.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Write the changes (leave unticked for a dry run)"
        type: boolean
        required: false
        default: false

concurrency:
  group: add-european-companies
  cancel-in-progress: false

jobs:
  add:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Database target guard
        env:
          EXPECTED_DB_TARGET_FINGERPRINT: ${{ vars.PRODUCTION_DB_TARGET_FINGERPRINT }}
        run: npm run scrape:db-target

      - name: Add companies
        env:
          APPLY: ${{ inputs.apply }}
        run: |
          if [ "$APPLY" = "true" ]; then
            npx tsx scripts/addEuropeanCompanies.ts --apply
          else
            npx tsx scripts/addEuropeanCompanies.ts
          fi
