name: 30-day research report

# Manual only, read-only. Prints salary and hiring statistics for the jobs added in the last 30 days (scripts/research-30d-stats.ts)
# to the run's summary and log, as the basis for a published research page. Every statement is a SELECT and the run is one
# READ ONLY transaction, so it cannot change data. It uses the same production-database fingerprint guard as the audit,
# migrate and freehire workflows.

on:
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Database target guard
        env:
          EXPECTED_DB_TARGET_FINGERPRINT: ${{ vars.PRODUCTION_DB_TARGET_FINGERPRINT }}
        run: npm run scrape:db-target

      - name: 30-day research report (read-only)
        run: npm run research:30d
